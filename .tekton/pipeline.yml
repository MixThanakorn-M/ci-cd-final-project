---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: output
  params:
    - name: repo-url
      type: string
      description: The URL of the git repo to clone
    - name: branch
      type: string
      description: The branch to clone
      default: main
    - name: build-image
      type: string
      description: The fully qualified name of the image to build and deploy
    - name: app-name
      type: string
      description: The name of the application deployment
      default: counter-service
  tasks:
    - name: cleanup
      workspaces:
        - name: source
          workspace: output
      taskRef:
        name: cleanup

    - name: git-clone
      workspaces:
        - name: output
          workspace: output
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.branch)
        - name: DELETE_EXISTING
          value: "true"
      runAfter:
        - cleanup

    - name: flake8
      workspaces:
        - name: source
          workspace: output
      taskRef:
        name: flake8
      params:
        - name: image
          value: "python:3.9-slim"
        - name: path
          value: "service"
        - name: args
          value: ["--count", "--max-complexity=10", "--max-line-length=127", "--statistics"]
      runAfter:
        - git-clone

    - name: nose
      workspaces:
        - name: source
          workspace: output
      taskRef:
        name: nose
      params:
        - name: args
          value: "-v --with-spec --spec-color"
      runAfter:
        - flake8

    - name: build
      workspaces:
        - name: source
          workspace: output
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: DOCKERFILE
          value: ./Dockerfile
      runAfter:
        - nose

    - name: deploy
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: openshift-client
          - name: namespace
            value: openshift-pipelines
      params:
        - name: SCRIPT
          value: |
            echo "Deploying $(params.app-name) with image $(params.build-image)"
            oc create deployment $(params.app-name) --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -
      runAfter:
        - build
